name: Commit messages

# Reusable conventional-commits check. Call it from a repository like this:
#
#   jobs:
#     commits:
#       uses: aistos-tech/.github/.github/workflows/commitlint.yml@main
#
# ⚠️ Commit messages are attacker-controlled on a fork PR, and they are on GitHub's
# workflow-injection list. Nothing here interpolates a message: commitlint is pointed at a git
# RANGE and reads the messages from git itself, so no subject ever reaches a shell. Keep it that
# way — `echo "${{ github.event.head_commit.message }}"` is the shape that gets repos owned.

on:
  workflow_call:
    inputs:
      config-path:
        description: >-
          Explicit path to a commitlint config. Normally unset: the job discovers every name
          cosmiconfig accepts and defers to commitlint's own resolution when it finds one.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  commitlint:
    name: commitlint
    runs-on: ubuntu-latest
    steps:
      # Full history: the range below walks from the merge base, which a shallow clone cannot reach.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Resolve the config
        id: config
        env:
          CONFIG: ${{ inputs.config-path }}
        run: |
          set -euo pipefail

          # Look for every name commitlint's own cosmiconfig resolution accepts, not just one.
          # Getting this wrong is silent and expensive: an unfound config falls back to the shared
          # default, which then judges a repo by rules it never adopted. debt-collection uses
          # commitlint.config.TS and was measured against a stricter default — 77 commits failed a
          # rule its own config does not set.
          if [ -n "$CONFIG" ] && [ -f "$CONFIG" ]; then
            echo "Using the caller's explicit config: $CONFIG"
            echo "args=--config $CONFIG" >> "$GITHUB_OUTPUT"; exit 0
          fi
          for f in commitlint.config.ts commitlint.config.js commitlint.config.mjs \
                   commitlint.config.cjs .commitlintrc .commitlintrc.json .commitlintrc.yaml \
                   .commitlintrc.yml .commitlintrc.js .commitlintrc.cjs .commitlintrc.ts; do
            if [ -f "$f" ]; then
              # Found one: pass NO --config and let commitlint resolve it itself, so extends,
              # monorepo lookup and TS loading all behave exactly as they do locally.
              echo "Repo config found ($f) — deferring to commitlint's own resolution."
              echo "args=" >> "$GITHUB_OUTPUT"; exit 0
            fi
          done
          if [ -f package.json ] && jq -e '.commitlint' package.json >/dev/null 2>&1; then
            echo "Repo config found (package.json#commitlint) — deferring to commitlint."
            echo "args=" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # No config at all: a repo with no JS toolchain still gets the check. Plain
          # config-conventional with NO added rules — a shared default that is stricter than the
          # config repos actually adopt would fail commits the org considers fine, which is how a
          # guard trains people to ignore it.
          cat > /tmp/commitlint.config.mjs <<'CFG'
          export default { extends: ["@commitlint/config-conventional"] };
          CFG
          echo "No commitlint config in this repo — using plain @commitlint/config-conventional."
          echo "args=--config /tmp/commitlint.config.mjs" >> "$GITHUB_OUTPUT"

      # The range, resolved from the event WITHOUT interpolating any text. On a PR this is the merge
      # base to the head SHA; on a push it is the pushed range. Both are SHAs, never messages.
      - name: Resolve the commit range
        id: range
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ] || [ "$EVENT" = "pull_request_target" ]; then
            from="$BASE_SHA"; to="$HEAD_SHA"
          else
            from="$PUSH_BEFORE"; to="$PUSH_AFTER"
          fi
          # A branch's first push reports an all-zero "before"; fall back to the single tip commit.
          case "$from" in
            0000000000000000000000000000000000000000|"") from="${to}~1" ;;
          esac
          git rev-parse --verify "$from" >/dev/null 2>&1 || from="${to}~1"
          echo "from=$from" >> "$GITHUB_OUTPUT"
          echo "to=$to"     >> "$GITHUB_OUTPUT"
          echo "Linting $from..$to"

      # Installed OUTSIDE the repository, on purpose. npx and npm read package.json from the
      # working directory, and a repo that declares `devEngines.packageManager: bun` aborts any
      # npm-family command with EBADDEVENGINES before it starts — a guard aimed at humans reaching
      # for the wrong package manager, which a CI step inherits by accident.
      - name: Install commitlint outside the repo
        working-directory: ${{ runner.temp }}
        run: npm install --no-save --prefix "$RUNNER_TEMP/cl" @commitlint/cli @commitlint/config-conventional

      # ...but RUN inside it, so config discovery, `extends` and the git range all resolve against
      # the repository rather than the temp directory.
      - name: commitlint
        env:
          CFG_ARGS: ${{ steps.config.outputs.args }}
          FROM: ${{ steps.range.outputs.from }}
          TO: ${{ steps.range.outputs.to }}
        run: |
          set -euo pipefail
          # NODE_PATH so a repo config's `extends: ["@commitlint/config-conventional"]` resolves to
          # the copy installed above, without the repo needing its dependencies installed.
          export NODE_PATH="$RUNNER_TEMP/cl/node_modules"
          # shellcheck disable=SC2086
          "$RUNNER_TEMP/cl/node_modules/.bin/commitlint" $CFG_ARGS --from "$FROM" --to "$TO" --verbose
